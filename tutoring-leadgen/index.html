<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補習主動搵客工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
         background: #0f1220; color: #e6e8ef; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { max-width: 620px; text-align: center; }
  h1 { font-size: 2rem; font-weight: 800;
       background: linear-gradient(90deg,#ff6b8b,#ffa86b); -webkit-background-clip: text;
       -webkit-text-fill-color: transparent; margin-bottom: 10px; }
  p.sub { color: #9aa0b4; margin-bottom: 30px; line-height: 1.6; }
  .cards { display: grid; gap: 14px; }
  a.card { display:block; background:#181c2e; border:1px solid #2a2f48; border-radius:14px;
           padding:20px 22px; text-decoration:none; color:#e6e8ef; text-align:left;
           transition:.15s; }
  a.card:hover { border-color:#ff6b8b; transform:translateY(-2px); }
  a.card .t { font-size:1.1rem; font-weight:700; }
  a.card .d { color:#9aa0b4; font-size:.9rem; margin-top:4px; }
  .note { margin-top:26px; background:#1a1430; border:1px solid #3a2e1e; border-radius:12px;
          padding:14px 16px; font-size:.82rem; color:#ffcd8c; text-align:left; line-height:1.6; }
  code { background:#0f1220; padding:2px 7px; border-radius:5px; color:#7cc4ff; font-size:.82rem; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎯 補習主動搵客工具</h1>
    <p class="sub">監察 Threads → AI 識別搵補習嘅人(避開同行)→ 半自動審核回覆</p>
    <div class="cards">
      <a class="card" href="preview.html">
        <div class="t">📋 審核台 Preview →</div>
        <div class="d">睇審核 UI 嘅 layout:leads 卡、評分、回覆草稿、複製/發送</div>
      </a>
      <a class="card" href="structure.html">
        <div class="t">🏗️ 專案結構 →</div>
        <div class="d">檔案樹、資料流、設計理念</div>
      </a>
    </div>
    <div class="note">
      ⚠️ 呢個係<strong>靜態 preview</strong>(畀你睇 UI)。真正可互動嘅審核台係 Python /
      Streamlit app,要喺你部機跑:<br>
      <code>pip install -r requirements.txt</code> → <code>python pipeline.py run</code> →
      <code>streamlit run app.py</code>
    </div>
  </div>
</body>
</html>
